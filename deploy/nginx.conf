# nginx of the web container. The host nginx (TLS, the domain) proxies here.

# Cloudflare already compresses at the edge; this covers direct hits and keeps
# the origin transfer small. Images (avif/webp/woff2) are already compressed.
gzip on;
gzip_vary on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types text/plain text/css text/xml application/javascript application/json
           application/xml image/svg+xml;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Use the host nginx's redirects, not absolute ones with the container port.
    absolute_redirect off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Astro emits hashed file names under /_astro: they never change.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.inc;
        try_files $uri =404;
    }

    # Self-hosted fonts keep a stable name, so cache them long but not immutable.
    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/security-headers.inc;
        try_files $uri =404;
    }

    # Icons, og image, sitemap, robots: stable names, revalidate daily.
    location ~* \.(?:ico|png|jpe?g|svg|xml|txt)$ {
        add_header Cache-Control "public, max-age=86400";
        include /etc/nginx/security-headers.inc;
        try_files $uri =404;
    }

    # The HTML is never cached so a new deploy shows up on the next visit.
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.inc;
        try_files $uri $uri/index.html =404;
    }
}
