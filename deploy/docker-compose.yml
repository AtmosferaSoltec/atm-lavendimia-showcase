# Production stack of the showcase. GitHub Actions copies it to /opt/showcase-web
# on each deploy; it is not edited by hand on the server.
#
# It never builds: the image is compiled once in CI and published to GHCR.
# The site is static and has no configuration or secrets, so there is no .env here.
# The HEALTHCHECK comes with the image (Dockerfile) and asks for /healthz.

networks:
  shared:
    name: atm-network
    external: true

services:
  app:
    image: ghcr.io/atmosferasoltec/atm-lavendimia-showcase:${IMAGE_TAG:-latest}
    container_name: showcase-web
    # Loopback only: the host nginx (showcase.atmosferast.com) is what publishes it.
    ports:
      - '127.0.0.1:3110:8080'
    networks:
      - shared
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    deploy:
      resources:
        limits:
          memory: 128m
